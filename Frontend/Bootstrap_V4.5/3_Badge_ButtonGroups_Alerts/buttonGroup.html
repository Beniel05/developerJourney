<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Button Groups</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
      crossorigin="anonymous"
    />
    <style>
      .heading {
        background-color: #000;
        color: #fff;
        text-align: right;
        padding: 10px 10px 15px 0;
        margin-bottom: 0;
        border-bottom: 1px solid #c7c7c7;
      }
    </style>
  </head>
  <body>
    <p class="heading">
      <a
        href="https://getbootstrap.com/docs/4.5/components/button-group/"
        target="_blank"
        >Go to Docs / Button Group</a
      >
    </p>

    <div class="container mt-3">
      <div class="btn-group">
        <button class="btn btn-primary">One</button>
        <button class="btn btn-warning">Two</button>
        <button class="btn btn-danger">Three</button>
      </div>
    </div>
    <div class="container mt-3">
      <div class="btn-group">
        <button class="btn btn-warning">One</button>
        <button class="btn btn-warning">Two</button>
        <button class="btn btn-warning">Three</button>
      </div>
    </div>

    <div class="container mt-3">
      <div
        class="btn-toolbar"
        role="toolbar"
        aria-label="Toolbar with button groups"
      >
        <div class="btn-group mr-2" role="group" aria-label="First group">
          <button type="button" class="btn btn-secondary">1</button>
          <button type="button" class="btn btn-secondary">2</button>
          <button type="button" class="btn btn-secondary">3</button>
          <button type="button" class="btn btn-secondary">4</button>
        </div>
        <div class="btn-group mr-2" role="group" aria-label="Second group">
          <button type="button" class="btn btn-secondary">5</button>
          <button type="button" class="btn btn-secondary">6</button>
          <button type="button" class="btn btn-secondary">7</button>
        </div>
        <div class="btn-group" role="group" aria-label="Third group">
          <button type="button" class="btn btn-secondary">8</button>
        </div>
      </div>
    </div>
  </body>
</html>
