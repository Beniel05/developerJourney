<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Responsive Grid Layout</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
      crossorigin="anonymous"
    />
    <style>
      .heading {
        background-color: #000;
        color: #fff;
        text-align: right;
        padding: 10px 10px 15px 0;
        margin-bottom: 0;
        border-bottom: 1px solid #c7c7c7;
      }
    </style>
  </head>
  <body>
    <p class="heading">
      <a href="https://getbootstrap.com/docs/4.5/layout/grid/" target="_blank"
        >Go to Docs / Grid Utilities</a
      >
    </p>

    <div class="container border mt-5 p-5">
      <div class="row justify-content-start border">
        <div class="col-4 border bg-primary">One of two columns</div>
        <div class="col-4 border bg-secondary">One of two columns</div>
      </div>
      <div class="row justify-content-center border">
        <div class="col-4 border bg-info">One of two columns</div>
        <div class="col-4 border bg-warning">One of two columns</div>
      </div>
      <div class="row justify-content-end border">
        <div class="col-4 border bg-danger">One of two columns</div>
        <div class="col-4 border bg-primary">One of two columns</div>
      </div>
      <div class="row justify-content-around">
        <div class="col-4 border bg-dark text-light">One of two columns</div>
        <div class="col-4 border bg-info">One of two columns</div>
      </div>
      <div class="row justify-content-between border">
        <div class="col-4 border bg-warning">One of two columns</div>
        <div class="col-4 border bg-danger">One of two columns</div>
      </div>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"
      integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
