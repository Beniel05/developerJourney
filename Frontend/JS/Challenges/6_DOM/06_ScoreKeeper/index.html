<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Keeper</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="img-container">
        <figure class="figure">
          <img
            src="https://images.unsplash.com/photo-1534158914592-062992fbe900?q=80&w=1199&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            class="figure-img img-fluid rounded"
            alt="Ping-pong-bat-img"
          />
          <figcaption class="figure-caption">Ping Pong Score Keeper</figcaption>
        </figure>
      </div>

      <div id="content-container">
        <h1><span id="p1Score">0</span> to <span id="p2Score">0</span></h1>
        <p>Use the buttons below to keeep score.</p>

        <div id="target-container">
          <label for="target"
            >Playing To
            <input type="number" />
          </label>
        </div>
      </div>
      <div id="buttons">
        <button id="p1Button" class="btn btn-success">+1 Player1</button>
        <button id="p2Button" class="btn btn-primary">+1 Player2</button>
        <button id="reset" class="btn btn-danger">Reset</button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
