<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline onclick Event</title>
</head>
<body>
    
    <h1 onclick="console.log('h1 got clicked.')">Inline Events Suck...</h1>
    <button onclick="console.log('Console Button has been clicked.')">Console Button</button>
    <button onclick="alert('Inline Button Alert! (1)'); alert('One More (1)!')">Single Click Alert</button>
    <button ondblclick="alert('Inline Button Alert! (2)'); alert('One More (2)!')">Double Click Alert</button>

    <script src="script.js"></script>

</body>
</html>
