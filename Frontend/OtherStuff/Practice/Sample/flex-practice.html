<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>

    <style>
        body {
            background-color: red;
            display: flex;
            min-height: 100vh;
            min-width: 100vw;
            align-items: center;
            justify-content: center;
        }
        #container {
            background-color: #c6c6c6;
            display: flex;
            gap: 20px;
        }
        div {
            background-color: orange;
        }
    </style>

</head>
<body>
    
    <div id="container">

        <div class="one">
            <h1>One</h1>
            <h2>One</h2>
        </div>
        <div class="two">
            <h1>Two</h1>
            <h2>Two</h2>
        </div>
        <div class="three">
            <h1>Three</h1>
            <h2>Three</h2>
        </div>
        <div class="four">
            <h1>Four</h1>
            <h2>Four</h2>
        </div>
        <div class="five">
            <h1>Five</h1>
            <h2>Five</h2>
        </div>

    </div>

</body>
</html>
