<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Second - Dynamic Form App</title>
</head>
<body bgColor = 'cyan'>

	<h1>Welcome to our Second Webapp</h1>
	<h2>Kindly Register to proceed further!</h2>
	
	<form method="post" action="./firstServlet">
		<table>
			<tr>
				<td>
					<label for="name">User Name</label>
				</td>
				<td>
					<input type="text" name="uname" id="name"/>
				</td>
			</tr>
			<tr>
				<td>
					<label for="city">User City</label>
				</td>
				<td>
					<input type="text" name="ucity" id="city"/>
				</td>
			</tr>
		</table>
		<button>Submit</button>
	</form>

</body>
</html>
